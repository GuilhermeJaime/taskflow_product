<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow · Simple task manager</title>
  <meta name="description" content="TaskFlow is a clean, fast task manager with search, filters, categories and dark mode." />
  <meta name="theme-color" content="#f5f5f7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5ce2'/%3E%3Cpath d='m9 16.5 4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- Ícones (sprite SVG) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14" /><path d="M5 12h14" /></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41" /></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.5 8.5 0 1 0 20.4 15.2Z" /></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none" /><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none" /><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none" /></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" /><path d="m8 12 2 2 5-5" /></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M16 3v4M8 3v4M3 10h18" /></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14" /><path d="M10 11v6M14 11v6" /></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.6-10.6a2 2 0 0 0-2.8-2.8L5.4 16.2 4 20Z" /><path d="m14.5 7.1 2.8 2.8" /></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
  </svg>

  <div class="app" id="app">
    <script>
      /* Aplica o tema guardado antes de desenhar a página (evita "flash" claro) */
      try {
        var t = localStorage.getItem("taskflow:theme");
        if (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) document.getElementById("app").classList.add("dark");
      } catch (e) {}
    </script>

    <button class="sidebar-scrim" id="scrim" aria-label="Close navigation" hidden></button>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark"><svg class="icon" width="18" height="18"><use href="#i-check" /></svg></span>
        <span>TaskFlow</span>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="all" aria-current="page"><svg class="icon" width="20" height="20"><use href="#i-tasks" /></svg><span>My tasks</span><span class="nav-count" id="count-all">0</span></button>
        <button class="nav-item" data-view="upcoming"><svg class="icon" width="20" height="20"><use href="#i-calendar" /></svg><span>Upcoming</span><span class="nav-count" id="count-upcoming">0</span></button>
      </nav>
      <div class="sidebar-section">
        <div class="sidebar-label">Workspace</div>
        <button class="workspace-row"><span class="workspace-avatar">P</span><span>Personal</span><svg class="icon" width="18" height="18"><use href="#i-more" /></svg></button>
      </div>
      <div class="sidebar-footer">
        <div class="profile">
          <span class="avatar">AM</span>
          <div><strong>Alex Morgan</strong><small>alex@example.com</small></div>
          <svg class="icon" width="18" height="18"><use href="#i-more" /></svg>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="open-sidebar" aria-label="Open navigation"><svg class="icon" width="20" height="20"><use href="#i-menu" /></svg></button>
        <label class="search">
          <svg class="icon" width="19" height="19"><use href="#i-search" /></svg>
          <span class="sr-only">Search tasks</span>
          <input id="search" type="search" placeholder="Search tasks..." autocomplete="off" />
          <kbd id="shortcut">⌘ K</kbd>
        </label>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme" aria-pressed="false">
          <span class="selected" data-mode="light"><svg class="icon" width="16" height="16"><use href="#i-sun" /></svg></span>
          <span data-mode="dark"><svg class="icon" width="16" height="16"><use href="#i-moon" /></svg></span>
        </button>
      </header>

      <div class="content">
        <section class="page-heading">
          <div>
            <p class="eyebrow">My workspace</p>
            <h1 id="page-title">My tasks</h1>
            <p class="subtitle" id="page-subtitle">Stay focused and make progress, one task at a time.</p>
          </div>
          <button class="primary-button" id="add-task"><svg class="icon" width="18" height="18"><use href="#i-plus" /></svg> Add task</button>
        </section>

        <section class="summary-grid" aria-label="Task summary">
          <div class="summary-card">
            <div><span class="summary-icon violet"><svg class="icon" width="19" height="19"><use href="#i-tasks" /></svg></span><p>Tasks left</p></div>
            <strong id="stat-pending">0</strong>
            <small>Keep up the momentum</small>
          </div>
          <div class="summary-card">
            <div><span class="summary-icon green"><svg class="icon" width="19" height="19"><use href="#i-check" /></svg></span><p>Completed</p></div>
            <strong id="stat-completed">0</strong>
            <small id="stat-percent">0% of all tasks</small>
            <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
          </div>
        </section>

        <section class="task-panel">
          <div class="panel-header">
            <div class="filters" id="filters" role="group" aria-label="Filter tasks">
              <button class="filter active" data-filter="all" aria-pressed="true">All<span>0</span></button>
              <button class="filter" data-filter="pending" aria-pressed="false">Pending<span>0</span></button>
              <button class="filter" data-filter="completed" aria-pressed="false">Completed<span>0</span></button>
            </div>
            <span class="result-count" id="result-count" aria-live="polite">0 tasks</span>
          </div>
          <div class="task-list" id="task-list"></div>
        </section>
      </div>
    </main>

    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <div><p class="eyebrow" id="modal-eyebrow">A new priority</p><h2 id="modal-title">Create a task</h2></div>
          <button class="icon-button" id="modal-close" type="button" aria-label="Close"><svg class="icon" width="20" height="20"><use href="#i-close" /></svg></button>
        </div>
        <form id="task-form" novalidate>
          <label class="field">Task name<input name="title" placeholder="What needs to be done?" maxlength="120" autocomplete="off" /><span class="error" id="title-error" role="alert"></span></label>
          <label class="field">Description<textarea name="description" placeholder="Add helpful context..." rows="3" maxlength="300"></textarea></label>
          <div class="field-row">
            <label class="field">Due date<input name="due" type="date" /></label>
            <label class="field">Category
              <select name="tag"><option>Work</option><option>Personal</option><option>Finance</option><option>Health</option></select>
            </label>
          </div>
          <div class="modal-actions">
            <button type="button" class="secondary-button" id="modal-cancel">Cancel</button>
            <button class="primary-button" type="submit" id="modal-submit">Create task</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

      <footer class="developer-signature">
      <p>
        Desenvolvido com <span>dedicação</span> por
        <a
          href="https://github.com/GuilhermeJaime"
          target="_blank"
          rel="noopener noreferrer"
          title="Visite o meu repositório GitHub"
          class="dev-link"
        >Guilherme Jaime</a>
      </p>
    </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
